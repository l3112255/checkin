<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>貴賓報到</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="貴賓報到">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#D8001E">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#FBF7F5}
body{display:flex;flex-direction:column;height:100dvh}
.top{flex:none;height:env(safe-area-inset-top,0px);background:linear-gradient(90deg,#D8001E 0%,#F2273A 50%,#D8001E 100%)}
.app{flex:1;min-height:0;border:0;width:100%;display:block;background:#FBF7F5}
.bot{flex:none;height:env(safe-area-inset-bottom,0px);background:#FFFFFF}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#7A6E70;background:#FBF7F5;padding:24px;text-align:center;line-height:1.6}
.msg b{color:#B5101F;font-size:20px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top"></div>
<iframe class="app" id="app" title="貴賓報到"></iframe>
<div class="bot"></div>
<div class="msg" id="msg" hidden><b>還沒設定網址</b><span>請用記事本打開 index.html，把點名網址貼到最上面的 APP_URL 引號裡，再重新上傳。</span></div>
<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  只要改這一行：把你的點名網址（結尾是 /exec）貼在兩個引號中間  ║
// ╚══════════════════════════════════════════════════════════════╝
const APP_URL = "https://script.google.com/macros/s/AKfycby-AlLNKH_-BhCAp9vU2CTUFJ-9XMnErCY2xo7I7gddEufvIv4hDIWALYvL6pK4OTVR/exec";

(function () {
  var f = document.getElementById('app');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(APP_URL)) { document.getElementById('msg').hidden = false; return; }
  f.src = APP_URL + (APP_URL.indexOf('?') >= 0 ? '&' : '?') + 'shell=1';
})();
</script>
</body>
</html>
